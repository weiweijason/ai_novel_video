# Video Worker - 獨立部署
# 硬體需求: RTX 5080 16GB VRAM
# 放置位置: 擁有 RTX 5080 的電腦

services:
  worker-video:
    build:
      context: .
    container_name: anime-worker-video
    restart: unless-stopped
    network_mode: host
    environment:
      API_BASE_URL: ${API_BASE_URL}
      WORKER_ID: ${WORKER_ID:-video-01}
      WORKER_TYPE: video
      WORKER_HOSTNAME: ${WORKER_HOSTNAME:-video-worker}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      WAN_MODEL_PATH: ${WAN_MODEL_PATH:-/models/wan/Wan2.1-I2V-14B-720P-NF4.safetensors}
      MOTION_MODEL_PATH: ${MOTION_MODEL_PATH:-/models/motion}
      MAX_VIDEO_LENGTH: ${MAX_VIDEO_LENGTH:-300}
      VIDEO_FPS: ${VIDEO_FPS:-24}
      VIDEO_WIDTH: ${VIDEO_WIDTH:-1920}
      VIDEO_HEIGHT: ${VIDEO_HEIGHT:-1080}
      VIDEO_INFERENCE_STEPS: ${VIDEO_INFERENCE_STEPS:-50}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./models/wan:/models/wan
      - ./models/motion:/models/motion
      - ./temp:/tmp